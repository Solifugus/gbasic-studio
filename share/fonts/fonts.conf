<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The ONLY fonts a `./studio shoot` figure may use. The launcher points
     FONTCONFIG_FILE here, so the host's fonts are not on the list at all and
     a figure looks the same on every machine. See README.md beside this. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <!-- Under the shot's own fresh HOME, so nothing is cached on the host. -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Qt asks for "Sans Serif" by that name; without its own alias it fell
       back to the first font on the list, the monospace one. -->
  <alias binding="same"><family>Sans Serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Sans</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
